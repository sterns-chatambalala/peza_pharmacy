{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="card card-hover rounded-xl p-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="{% url 'settings' %}" class="text-slate-400 hover:text-white transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <h1 class="text-xl font-bold text-white">Change Password</h1>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label class="block text-sm text-slate-400 mb-1">Current Password *</label>
        <input type="password" name="old_password" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-1">New Password *</label>
        <input type="password" name="new_password1" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        <ul class="text-xs text-slate-500 mt-1 space-y-0.5">
          <li>• At least 8 characters</li>
          <li>• Cannot be too similar to personal info</li>
          <li>• Cannot be a commonly used password</li>
        </ul>
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-1">Confirm New Password *</label>
        <input type="password" name="new_password2" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
      </div>

      <div class="flex gap-3 pt-4 border-t border-white/5">
        <button type="submit" class="px-6 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg transition">
          <i data-lucide="save" class="w-4 h-4 inline mr-2"></i> Update Password
        </button>
        <a href="{% url 'settings' %}" class="px-6 py-2 bg-base-700 hover:bg-base-600 text-slate-300 font-medium rounded-lg transition">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
