{% extends "base.html" %}
{% block title %}Delete Supplier{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="card card-hover rounded-xl p-6">
    <div class="text-center">
      <div class="w-16 h-16 rounded-full bg-red-500/15 text-red-400 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="alert-triangle" class="w-8 h-8"></i>
      </div>
      <h2 class="text-xl font-bold text-white">Delete Supplier</h2>
      <p class="text-sm text-slate-400 mt-2">
        Are you sure you want to delete <strong>{{ supplier.name }}</strong>?
        This action cannot be undone.
      </p>
      <p class="text-xs text-slate-500 mt-1">
        This will also remove all associated data.
      </p>
    </div>

    <form method="post" class="flex gap-3 mt-6">
      {% csrf_token %}
      <button type="submit" class="flex-1 px-6 py-2 bg-red-500 hover:bg-red-600 text-white font-medium rounded-lg transition">
        <i data-lucide="trash" class="w-4 h-4 inline mr-2"></i> Delete
      </button>
      <a href="{% url 'supplier_detail' supplier.id %}" class="flex-1 px-6 py-2 bg-base-700 hover:bg-base-600 text-slate-300 font-medium rounded-lg transition text-center">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
