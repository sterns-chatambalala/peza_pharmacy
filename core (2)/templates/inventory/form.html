{% extends "base.html" %}
{% block title %}{{ drug|yesno:"Edit Drug,Add Drug" }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card card-hover rounded-xl p-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="{% url 'drug_list' %}" class="text-slate-400 hover:text-white transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <h1 class="text-xl font-bold text-white">{{ drug|yesno:"Edit Drug,Add Drug" }}</h1>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Drug Name *</label>
          <input type="text" name="name" value="{{ drug.name|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Generic Name</label>
          <input type="text" name="generic_name" value="{{ drug.generic_name|default:'' }}" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Batch No. *</label>
          <input type="text" name="batch_no" value="{{ drug.batch_no|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Category *</label>
          <input type="text" name="category" value="{{ drug.category|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Manufacturer</label>
          <input type="text" name="manufacturer" value="{{ drug.manufacturer|default:'' }}" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Dosage Form</label>
          <select name="dosage_form" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
            <option value="">Select...</option>
            <option value="tablet" {% if drug.dosage_form == 'tablet' %}selected{% endif %}>Tablet</option>
            <option value="capsule" {% if drug.dosage_form == 'capsule' %}selected{% endif %}>Capsule</option>
            <option value="syrup" {% if drug.dosage_form == 'syrup' %}selected{% endif %}>Syrup</option>
            <option value="suspension" {% if drug.dosage_form == 'suspension' %}selected{% endif %}>Suspension</option>
            <option value="injection" {% if drug.dosage_form == 'injection' %}selected{% endif %}>Injection</option>
            <option value="cream" {% if drug.dosage_form == 'cream' %}selected{% endif %}>Cream/Ointment</option>
            <option value="drops" {% if drug.dosage_form == 'drops' %}selected{% endif %}>Drops</option>
            <option value="inhaler" {% if drug.dosage_form == 'inhaler' %}selected{% endif %}>Inhaler</option>
            <option value="suppository" {% if drug.dosage_form == 'suppository' %}selected{% endif %}>Suppository</option>
            <option value="powder" {% if drug.dosage_form == 'powder' %}selected{% endif %}>Powder</option>
            <option value="other" {% if drug.dosage_form == 'other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Strength</label>
          <input type="text" name="strength" value="{{ drug.strength|default:'' }}" placeholder="e.g. 500mg" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Unit</label>
          <select name="unit" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
            <option value="tablet" {% if drug.unit == 'tablet' %}selected{% endif %}>Tablet(s)</option>
            <option value="capsule" {% if drug.unit == 'capsule' %}selected{% endif %}>Capsule(s)</option>
            <option value="bottle" {% if drug.unit == 'bottle' %}selected{% endif %}>Bottle(s)</option>
            <option value="vial" {% if drug.unit == 'vial' %}selected{% endif %}>Vial(s)</option>
            <option value="tube" {% if drug.unit == 'tube' %}selected{% endif %}>Tube(s)</option>
            <option value="sachet" {% if drug.unit == 'sachet' %}selected{% endif %}>Sachet(s)</option>
            <option value="pack" {% if drug.unit == 'pack' %}selected{% endif %}>Pack(s)</option>
            <option value="ml" {% if drug.unit == 'ml' %}selected{% endif %}>ml</option>
            <option value="unit" {% if drug.unit == 'unit' %}selected{% endif %}>Unit(s)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Price (MWK) *</label>
          <input type="number" step="0.01" name="price" value="{{ drug.price|default:'0' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Cost Price (MWK)</label>
          <input type="number" step="0.01" name="cost_price" value="{{ drug.cost_price|default:'0' }}" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Quantity *</label>
          <input type="number" name="quantity" value="{{ drug.quantity|default:'0' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Reorder Level</label>
          <input type="number" name="reorder_level" value="{{ drug.reorder_level|default:'10' }}" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Expiry Date *</label>
          <input type="date" name="expiry_date" value="{{ drug.expiry_date|date:'Y-m-d'|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Barcode</label>
          <input type="text" name="barcode" value="{{ drug.barcode|default:'' }}" placeholder="Optional" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Location</label>
          <input type="text" name="location" value="{{ drug.location|default:'' }}" placeholder="Shelf/storage location" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-2 text-sm text-slate-400">
            <input type="checkbox" name="requires_prescription" {% if drug.requires_prescription %}checked{% endif %} class="w-4 h-4 accent-emerald-500">
            Requires Prescription
          </label>
          <label class="flex items-center gap-2 text-sm text-slate-400">
            <input type="checkbox" name="is_controlled_substance" {% if drug.is_controlled_substance %}checked{% endif %} class="w-4 h-4 accent-emerald-500">
            Controlled Substance
          </label>
          <label class="flex items-center gap-2 text-sm text-slate-400">
            <input type="checkbox" name="is_active" {% if drug.is_active != False %}checked{% endif %} class="w-4 h-4 accent-emerald-500">
            Active
          </label>
        </div>
      </div>

      <div class="flex gap-3 pt-4 border-t border-white/5">
        <button type="submit" class="px-6 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg transition">
          <i data-lucide="save" class="w-4 h-4 inline mr-2"></i> {{ drug|yesno:"Update,Create" }}
        </button>
        <a href="{% url 'drug_list' %}" class="px-6 py-2 bg-base-700 hover:bg-base-600 text-slate-300 font-medium rounded-lg transition">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
