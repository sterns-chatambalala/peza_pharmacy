<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .button { display: inline-block; padding: 15px 30px; background: #00663a; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .footer { text-align: center; margin-top: 30px; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://esltd.co.uk/wp-content/uploads/2016/07/IMS.png" alt="IMS Logo" style="height: 70px;">
            <h1>Reset Your Password</h1>
            <p>Dear {{ user.username }},</p>
            <p>We received a request to reset your password. If this was you, click the button below to reset it.</p>
        </div>
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ reset_url }}" class="button">Reset Password</a>
        </div>
        <p>If you didn't request this, please ignore this email or contact support.</p>
        <div class="footer">
            <p>&copy; 2025 IMS. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
