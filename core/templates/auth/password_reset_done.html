{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <!-- Same head as password_reset.html -->
    <title>Password Reset Link Sent - Pharmacy Management System</title>
    <!-- Include same CSS as above -->
     
</head>
<body>
    <div class="theme-toggle">
        <button id="light-mode" class="active"><span class="material-icons">light_mode</span></button>
        <button id="dark-mode"><span class="material-icons">dark_mode</span></button>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="{% static 'logo.png' %}" alt="Logo">
                <h1>Check Your Email</h1>
                <p>A password reset link has been sent to your email address.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <div class="login-footer">
                <a href="{% url 'login' %}">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Same JavaScript for theme toggle -->
    <script>
        const lightModeBtn = document.getElementById('light-mode');
        const darkModeBtn = document.getElementById('dark-mode');

        lightModeBtn.addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', 'light');
            lightModeBtn.classList.add('active');
            darkModeBtn.classList.remove('active');
        });

        darkModeBtn.addEventListener('click', () => {
            document.documentElement.setAttribute('data-theme', 'dark');
            darkModeBtn.classList.add('active');
            lightModeBtn.classList.remove('active');
        });
    </script>
</body>
</html>
