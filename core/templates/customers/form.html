{% extends "base.html" %}
{% block title %}{{ customer|yesno:"Edit Customer,Add Customer" }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card rounded-xl p-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="{% url 'customer_list' %}" class="text-slate-400 hover:text-white transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <h1 class="text-xl font-bold text-white">{{ customer|yesno:"Edit Customer,Add Customer" }}</h1>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Full Name *</label>
          <input type="text" name="name" value="{{ customer.name|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Phone *</label>
          <input type="text" name="phone" value="{{ customer.phone|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Email</label>
          <input type="email" name="email" value="{{ customer.email|default:'' }}" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Date of Birth</label>
          <input type="date" name="date_of_birth" value="{{ customer.date_of_birth|date:'Y-m-d'|default:'' }}" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div class="col-span-2">
          <label class="block text-sm text-slate-400 mb-1">Address</label>
          <textarea name="address" rows="2" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">{{ customer.address|default:'' }}</textarea>
        </div>
        <div class="col-span-2">
          <label class="block text-sm text-slate-400 mb-1">Allergies</label>
          <textarea name="allergies" rows="2" placeholder="Known drug allergies" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">{{ customer.allergies|default:'' }}</textarea>
        </div>
        <div class="col-span-2">
          <label class="block text-sm text-slate-400 mb-1">Chronic Conditions</label>
          <textarea name="chronic_conditions" rows="2" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">{{ customer.chronic_conditions|default:'' }}</textarea>
        </div>
      </div>

      <div class="flex gap-3 pt-4 border-t border-white/5">
        <button type="submit" class="px-6 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg transition">
          <i data-lucide="save" class="w-4 h-4 inline mr-2"></i> {{ customer|yesno:"Update,Create" }}
        </button>
        <a href="{% url 'customer_list' %}" class="px-6 py-2 bg-base-700 hover:bg-base-600 text-slate-300 font-medium rounded-lg transition">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
