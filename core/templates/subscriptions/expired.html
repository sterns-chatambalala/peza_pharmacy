{% extends "base.html" %}
{% block title %}Subscription Expired{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-8">
  <div class="card rounded-xl p-6 text-center">
    <div class="w-20 h-20 rounded-full bg-red-500/15 text-red-400 flex items-center justify-center mx-auto mb-4">
      <i data-lucide="alert-octagon" class="w-10 h-10"></i>
    </div>
    <h1 class="text-2xl font-bold text-white">Subscription Expired</h1>
    <p class="text-sm text-slate-400 mt-2">
      Your subscription for <strong>{{ tenant.name }}</strong> has expired.
    </p>
    <p class="text-sm text-slate-400">
      You are <strong class="text-red-400">{{ days_overdue }}</strong> days overdue.
    </p>

    <div class="mt-6 space-y-3">
      <a href="{% url 'renew_subscription' %}" class="inline-flex items-center gap-2 px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg transition">
        <i data-lucide="credit-card" class="w-5 h-5"></i> Renew Now
      </a>
      <div>
        <a href="{% url 'logout' %}" class="text-sm text-slate-500 hover:text-white transition">Logout</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
