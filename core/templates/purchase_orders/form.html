{% extends "base.html" %}
{% block title %}New Purchase Order{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="card rounded-xl p-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="{% url 'purchase_order_list' %}" class="text-slate-400 hover:text-white transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <h1 class="text-xl font-bold text-white">New Purchase Order</h1>
    </div>

    <form method="post" id="po-form" class="space-y-4">
      {% csrf_token %}
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Supplier *</label>
          <select name="supplier" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
            <option value="">Select a supplier...</option>
            {% for supplier in form.fields.supplier.queryset %}
            <option value="{{ supplier.id }}">{{ supplier.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Expected Delivery</label>
          <input type="date" name="expected_delivery" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div class="col-span-2">
          <label class="block text-sm text-slate-400 mb-1">Notes</label>
          <textarea name="notes" rows="2" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50"></textarea>
        </div>
      </div>

      <div class="border-t border-white/5 pt-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-white">Order Items</h3>
          <button type="button" onclick="addItem()" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded-lg transition">
            <i data-lucide="plus" class="w-3.5 h-3.5 inline mr-1"></i> Add Item
          </button>
        </div>

        <div id="items-container" class="space-y-3">
          <!-- Items added dynamically -->
        </div>

        <div id="no-items-message" class="text-center py-4 text-slate-500 text-sm">
          No items added yet. Click "Add Item" to start.
        </div>
      </div>

      <div class="flex gap-3 pt-4 border-t border-white/5">
        <button type="submit" class="px-6 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg transition">
          <i data-lucide="save" class="w-4 h-4 inline mr-2"></i> Create Purchase Order
        </button>
        <a href="{% url 'purchase_order_list' %}" class="px-6 py-2 bg-base-700 hover:bg-base-600 text-slate-300 font-medium rounded-lg transition">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
let itemCount = 0;
const drugs = {{ drugs|safe }};

function addItem() {
  const container = document.getElementById('items-container');
  const noMsg = document.getElementById('no-items-message');
  noMsg.style.display = 'none';

  const div = document.createElement('div');
  div.className = 'grid grid-cols-1 md:grid-cols-4 gap-3 items-end p-3 bg-base-800 rounded-lg border border-white/5';
  div.dataset.index = itemCount;

  // Drug selection
  const drugSelect = document.createElement('select');
  drugSelect.name = 'drug_id[]';
  drugSelect.className = 'w-full bg-base-700 border border-white/5 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500/50';
  drugSelect.innerHTML = `<option value="">Select drug...</option>`;
  drugs.forEach(d => {
    drugSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`;
  });

  // Drug name input (for manual entry)
  const drugName = document.createElement('input');
  drugName.type = 'text';
  drugName.name = 'drug_name[]';
  drugName.placeholder = 'Drug name (manual)';
  drugName.className = 'w-full bg-base-700 border border-white/5 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500/50';

  // Quantity
  const qtyInput = document.createElement('input');
  qtyInput.type = 'number';
  qtyInput.name = 'quantity_ordered[]';
  qtyInput.placeholder = 'Qty';
  qtyInput.min = 1;
  qtyInput.className = 'w-full bg-base-700 border border-white/5 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500/50';

  // Unit cost
  const costInput = document.createElement('input');
  costInput.type = 'number';
  costInput.name = 'unit_cost[]';
  costInput.placeholder = 'Unit cost';
  costInput.step = 0.01;
  costInput.min = 0;
  costInput.className = 'w-full bg-base-700 border border-white/5 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500/50';

  // Remove button
  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.innerHTML = '<i data-lucide="x" class="w-4 h-4"></i>';
  removeBtn.className = 'p-1.5 rounded bg-red-500/20 text-red-400 hover:bg-red-500/30 transition';
  removeBtn.onclick = function() { div.remove(); if (container.children.length === 0) noMsg.style.display = 'block'; };

  const wrapper = document.createElement('div');
  wrapper.className = 'md:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-3';
  wrapper.appendChild(drugSelect);
  wrapper.appendChild(drugName);
  wrapper.appendChild(qtyInput);
  wrapper.appendChild(costInput);

  div.appendChild(wrapper);
  div.appendChild(removeBtn);
  container.appendChild(div);
  itemCount++;

  // Re-create icons
  lucide.createIcons();
}
</script>
{% endblock %}
