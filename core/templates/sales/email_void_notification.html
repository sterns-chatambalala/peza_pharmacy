<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sale Void Notification</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #dc2626; color: white; padding: 15px; border-radius: 4px; }
        .content { padding: 20px; background: #f9f9f9; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sale #{{ sale.sale_id }} Voided</h1>
        </div>
        <div class="content">
            <p>Dear {{ admin.username }},</p>
            <p>Sale #{{ sale.sale_id }} has been voided by {{ voided_by.username }}.</p>
            <p><strong>Reason:</strong> {{ reason }}</p>
            <p><strong>Date:</strong> {{ sale.date|date:"M d, Y H:i" }}</p>
        </div>
    </div>
</body>
</html>
