{% extends "base.html" %}
{% block title %}{{ claim|yesno:"Edit Claim,New Claim" }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card rounded-xl p-6">
    <div class="flex items-center gap-3 mb-6">
      <a href="{% url 'insurance_claim_list' %}" class="text-slate-400 hover:text-white transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <h1 class="text-xl font-bold text-white">{{ claim|yesno:"Edit Claim,New Insurance Claim" }}</h1>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Claim ID *</label>
          <input type="text" name="claim_id" value="{{ claim.claim_id|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Patient Name *</label>
          <input type="text" name="patient_name" value="{{ claim.patient_name|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Patient ID</label>
          <input type="text" name="patient_id" value="{{ claim.patient_id|default:'' }}" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Insurance Provider *</label>
          <input type="text" name="insurance_provider" value="{{ claim.insurance_provider|default:'' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Claim Amount (MWK) *</label>
          <input type="number" step="0.01" name="claim_amount" value="{{ claim.claim_amount|default:'0' }}" required class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Status</label>
          <select name="status" class="w-full bg-base-800 border border-white/5 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
            <option value="pending" {% if claim.status == 'pending' %}selected{% endif %}>Pending</option>
            <option value="approved" {% if claim.status == 'approved' %}selected{% endif %}>Approved</option>
            <option value="rejected" {% if claim.status == 'rejected' %}selected{% endif %}>Rejected</option>
            <option value="processed" {% if claim.status == 'processed' %}selected{% endif %}>Processed</option>
          </select>
        </div>
      </div>

      <div class="flex gap-3 pt-4 border-t border-white/5">
        <button type="submit" class="px-6 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg transition">
          <i data-lucide="save" class="w-4 h-4 inline mr-2"></i> {{ claim|yesno:"Update,Create" }}
        </button>
        <a href="{% url 'insurance_claim_list' %}" class="px-6 py-2 bg-base-700 hover:bg-base-600 text-slate-300 font-medium rounded-lg transition">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
